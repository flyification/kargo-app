<!DOCTYPE html>
<html lang="tr"><head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kargo Operasyon Eğitim Uygulaması</title>
<style>
 html,body{margin:0;height:100%;font-family:"Segoe UI",system-ui,Arial,sans-serif;
   background:radial-gradient(1200px 600px at 50% -10%,#1a2a3a,#0b1016);color:#e7eef5}
 .gate{min-height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
 .box{background:#17222e;border:1px solid #2b3c4d;border-radius:16px;padding:36px 32px;
   max-width:380px;width:100%;box-shadow:0 18px 50px #0009;text-align:center}
 .logo{width:56px;height:56px;border-radius:14px;background:#e30613;color:#fff;font-size:28px;
   font-weight:800;display:flex;align-items:center;justify-content:center;margin:0 auto 18px}
 h1{font-size:18px;margin:0 0 4px} p.s{color:#8aa0b3;font-size:13px;margin:0 0 22px}
 input[type=password]{width:100%;padding:13px;border-radius:10px;border:1px solid #2b3c4d;
   background:#1e2c3a;color:#e7eef5;font-size:16px;text-align:center;letter-spacing:3px;
   box-sizing:border-box}
 input[type=password]:focus{outline:none;border-color:#1f7ae0}
 .rem{display:flex;align-items:center;gap:8px;justify-content:center;color:#8aa0b3;
   font-size:13px;margin-top:14px;cursor:pointer}
 .rem input{accent-color:#e30613;width:auto}
 button{margin-top:14px;width:100%;padding:13px;border:none;border-radius:10px;
   background:#e30613;color:#fff;font-size:15px;font-weight:700;cursor:pointer}
 button:hover{filter:brightness(1.08)} button:disabled{opacity:.6;cursor:wait}
 .err{color:#ff8a96;font-size:13px;margin-top:12px;min-height:20px}
 .cr{color:#5a6b7a;font-size:10.5px;margin-top:18px}
 @keyframes shake{0%,100%{transform:translateX(0)}20%{transform:translateX(-8px)}
   40%{transform:translateX(8px)}60%{transform:translateX(-5px)}80%{transform:translateX(5px)}}
</style>
</head><body>
<div class="gate"><div class="box" id="box">
  <div class="logo">&#9992;</div>
  <h1>Kargo Operasyon Eğitim Uygulaması</h1>
  <p class="s">Devam etmek için parolayı giriniz</p>

         autofocus onkeydown="if(event.key==='Enter')go()">
  <label class="rem"><input type="checkbox" id="rem"> Bu cihazda beni hatırla</label>
  <button id="btn" onclick="go()">Giriş</button>
  <div class="err" id="err"></div>

const b64d = s=>{const b=atob(s);const u=new Uint8Array(b.length);for(let i=0;i<b.length;i++)u[i]=b.charCodeAt(i);return u;};
const b64e = u=>btoa(String.fromCharCode(...u));

async function deriveKey(pw){
  const km=await crypto.subtle.importKey('raw',new TextEncoder().encode(pw),'PBKDF2',false,['deriveKey']);
  return crypto.subtle.deriveKey(
    {name:'PBKDF2',salt:b64d(SALT),iterations:IT,hash:'SHA-256'},
    km,{name:'AES-CTR',length:256},true,['encrypt','decrypt']);
}
async function decrypt(key){
  const ct=b64d(CT);
  const pt=await crypto.subtle.decrypt({name:'AES-CTR',counter:b64d(NONCE),length:64},key,ct);
  return new TextDecoder('utf-8').decode(pt);
}
async function tryKey(rawKey){
  const key=await crypto.subtle.importKey('raw',b64d(rawKey),{name:'AES-CTR',length:256},false,['decrypt']);
  return decrypt(key);
}
async function go(){
  const pw=document.getElementById('pw').value;
  const err=document.getElementById('err'),btn=document.getElementById('btn');
  err.textContent=''; btn.disabled=true; btn.textContent='Açılıyor…';
  try{
    const key=await deriveKey(pw);
    const html=await decrypt(key);
    const rawKey=b64e(new Uint8Array(await crypto.subtle.exportKey('raw',key)));
    if(document.getElementById('rem').checked)
      try{localStorage.setItem(RK,rawKey);}catch(e){}
    document.open();document.write(html);document.close();
  }catch(e){
    err.textContent='Hatalı parola. Tekrar deneyin.';
    btn.disabled=false;btn.textContent='Giriş';
    document.getElementById('pw').value='';
    document.getElementById('pw').focus();
    const b=document.getElementById('box');
    b.style.animation='';void b.offsetWidth;b.style.animation='shake .4s ease';
  }
}
// Auto-unlock if key is remembered
(async()=>{
  try{
    const rk=localStorage.getItem(RK);
    if(rk){
      const html=await tryKey(rk);
      document.open();document.write(html);document.close();
    }
  }catch(e){try{localStorage.removeItem(RK);}catch(_){}}
})();
</script>
